# Integración continua: en cada push construye las imágenes, corre las pruebas
# y hace una prueba de humo del contenedor final.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  construir-y-probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen de pruebas
        run: docker build --target test -t vf-test .

      - name: Ejecutar pruebas automatizadas
        run: docker run --rm vf-test

      - name: Construir imagen de producción
        run: docker build --target runtime -t vf-api .

      - name: Prueba de humo del contenedor
        run: |
          docker run -d -p 8000:8000 --name api vf-api
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/api/v1/health && break
            sleep 2
          done
          curl -fs http://localhost:8000/api/v1/health
          curl -fs http://localhost:8000/api/v1/info

      - name: Logs del contenedor
        if: always()
        run: docker logs api || true
